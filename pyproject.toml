[project]
name = "faultline"
version = "0.1.0"
description = "Agentic root-cause investigation for Kubernetes microservices, with verified, cited RCA reports."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ishaan Nene" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "anthropic>=0.40",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "structlog>=24.4",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "anyio>=4.6",
]

[project.scripts]
faultline = "faultline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]

[tool.pytest.ini_options]
# src-layout without an editable install: Desktop is iCloud-synced and editable
# installs break there, so tests import straight from src/.
# "." is the repo root, so `from tests.conftest import ...` resolves whether
# pytest is invoked as `pytest` or as `python -m pytest` (only the latter puts
# the working directory on sys.path).
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not ollama'"
markers = [
  "integration: requires live Postgres and Redis (docker compose up -d)",
  "ollama: requires a running Ollama daemon with the local models pulled",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["faultline"]
strict = true
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["langgraph.*", "langgraph_checkpoint.*", "asyncpg.*"]
ignore_missing_imports = true

# redis-py ships partial annotations and its async client's aclose() is untyped,
# so the strict call check has to be relaxed where we call into it.
[[tool.mypy.overrides]]
module = ["faultline.adapters.redis_streams"]
disallow_untyped_calls = false
